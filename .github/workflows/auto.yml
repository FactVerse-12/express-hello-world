name: auto-post
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # roz subah 9:30 IST

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python main.py
        env:
          INSTA_TOKEN: ${{ secrets.INSTA_TOKEN }}
          INSTA_ID: ${{ secrets.INSTA_ID }}
      - name: Save memory for infinite loop
        run: |
          git config user.name "factory-bot"
          git config user.email "bot@factory.com"
          touch used_topics.json
          git add -A
          git commit -m "update memory" || echo "nothing to commit"
          git push || echo "push failed"
