name: StoryToons Auto
on:
  schedule:
    - cron: '30 1 * * *'
    - cron: '30 6 * * *'
    - cron: '30 10 * * *'
    - cron: '0 14 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with: { python-version: '3.10' }
      - run: |
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          python main.py
      - name: Save used topics
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add used_topics.json
          git commit -m "update used ${{ github.run_number }}" || echo "no change"
          git push
